spring:
  datasource:
    # Azure Container Apps: database-url, database-username, database-password
    # Local/docker legacy: DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD (see Application.java)
    url: ${database-url:jdbc:postgresql://localhost:5432/postgres}
    username: ${database-username:postgres}
    password: ${database-password:?Database password must be provided}
    driver-class-name: org.postgresql.Driver

  # Versioned schema migrations. Flyway runs before Hibernate on every boot.
  #
  # Transitional state: Hibernate still owns table/column *creation* via ddl-auto=update,
  # while Flyway owns the changes ddl-auto provably cannot make — dropping constraints,
  # altering nullability, adding NOT NULL columns to populated tables, and backfills.
  # Those are the two failures that caused the reviews.like_count outage and the
  # reviews.user_id landmine.
  #
  # To finish the migration, see db/migration/README.md: generate V1__baseline.sql from a
  # pg_dump of prod, then switch ddl-auto to `validate` so drift fails the boot instead of
  # silently corrupting the schema. Do NOT set `validate` before that baseline exists.
  flyway:
    enabled: true
    # The dev and prod databases already exist and predate Flyway, so they need a baseline
    # marker rather than an attempt to replay history from scratch.
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # Transactional email (SMTP). Provider-agnostic: point these at Resend / Brevo / SES.
  # If MAIL_HOST is unset, EmailService logs the link instead of sending (safe for local/dev).
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    com.curtinhonestly.backend: DEBUG
jwt:
  secret: ${jwt-secret:?JWT secret must be provided}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201,https://nice-pebble-059fa6b00.7.azurestaticapps.net}
  # Base URL of the student frontend, used to build verification links in emails.
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
  mail:
    from: ${MAIL_FROM:no-reply@curtinhonestly.com}
    verification-token-ttl-hours: ${VERIFICATION_TOKEN_TTL_HOURS:24}
    reset-token-ttl-hours: ${RESET_TOKEN_TTL_HOURS:1}