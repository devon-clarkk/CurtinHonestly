<div class="legend">
  <span><i class="swatch reviews"></i> Reviews <strong>{{ totals().reviews }}</strong></span>
  <span><i class="swatch users"></i> Users <strong>{{ totals().users }}</strong></span>
</div>

@if (slots().length) {
  <svg
    class="series"
    [attr.viewBox]="'0 0 ' + width + ' ' + height"
    width="100%"
    role="img"
    aria-label="New reviews and new users per day"
  >
    <!-- gridlines and y ticks -->
    @for (tick of yTicks(); track tick.value) {
      <line class="grid" [attr.x1]="padding.left" [attr.x2]="width - padding.right" [attr.y1]="tick.y" [attr.y2]="tick.y" />
      <text class="tick" [attr.x]="padding.left - 6" [attr.y]="tick.y + 3" text-anchor="end">{{ tick.value }}</text>
    }
    <line class="baseline" [attr.x1]="padding.left" [attr.x2]="width - padding.right" [attr.y1]="baselineY" [attr.y2]="baselineY" />

    @if (asLines()) {
      <path class="line reviews" [attr.d]="reviewsPath()" />
      <path class="line users" [attr.d]="usersPath()" />
      @if (lastSlot(); as last) {
        <circle class="marker reviews" [attr.cx]="last.x + last.width / 2" [attr.cy]="last.reviewsY" r="4" />
        <circle class="marker users" [attr.cx]="last.x + last.width / 2" [attr.cy]="last.usersY" r="4" />
      }
    } @else {
      @for (slot of slots(); track slot.point.period) {
        @if (slot.reviewsBar.height > 0) {
          <rect class="bar reviews" [attr.x]="slot.reviewsBar.x" [attr.y]="slot.reviewsBar.y" [attr.width]="slot.reviewsBar.width" [attr.height]="slot.reviewsBar.height" rx="0" />
        }
        @if (slot.usersBar.height > 0) {
          <rect class="bar users" [attr.x]="slot.usersBar.x" [attr.y]="slot.usersBar.y" [attr.width]="slot.usersBar.width" [attr.height]="slot.usersBar.height" rx="0" />
        }
      }
    }

    <!-- x labels and hover targets (one per day, full plot height) -->
    @for (slot of slots(); track slot.point.period) {
      @if (slot.tick) {
        <text class="tick" [attr.x]="slot.x + slot.width / 2" [attr.y]="height - 10" text-anchor="middle">{{ slot.label }}</text>
      }
      <rect class="hit" [attr.x]="slot.x" [attr.y]="padding.top" [attr.width]="slot.width" [attr.height]="baselineY - padding.top">
        <title>{{ tooltip(slot) }}</title>
      </rect>
    }
  </svg>

  <details class="table-twin">
    <summary>Table view</summary>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Day</th>
            <th class="num">Reviews</th>
            <th class="num">Users</th>
          </tr>
        </thead>
        <tbody>
          @for (slot of slots(); track slot.point.period) {
            <tr>
              <td>{{ slot.point.period }}</td>
              <td class="num">{{ slot.point.reviews }}</td>
              <td class="num">{{ slot.point.users }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </details>
} @else {
  <p class="empty">No activity in this period.</p>
}
