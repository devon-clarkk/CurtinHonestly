name: Require dev to main

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Only dev may merge into main
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::PRs to main are only allowed from the dev branch (got: ${{ github.head_ref }})"
            exit 1
          fi
          echo "OK: dev -> main"
