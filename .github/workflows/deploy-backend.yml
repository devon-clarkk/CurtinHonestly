name: Deploy Backend

on:
  push:
    branches:
      - dev
      - development
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
    steps:
      - id: pick
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "environment=prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=dev" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: resolve-environment
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-environment.outputs.environment }}
    env:
      DEPLOY_ENV: ${{ needs.resolve-environment.outputs.environment }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/curtinhonestly-backend:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The image is a public GHCR package, so the Container App pulls it
      # anonymously and needs no registry credentials of its own.
      - name: Build and push image to GHCR
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t "$IMAGE" ./backend
          docker push "$IMAGE"

      - name: Deploy to Container App
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          # Fallback keeps the port a valid integer even if the secret is unset,
          # so the app boots (email just stays in log-only mode) instead of failing to parse.
          MAIL_PORT: ${{ secrets.MAIL_PORT || '587' }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          FRONTEND_BASE_URL: ${{ secrets.FRONTEND_BASE_URL }}
        run: |
          set -euo pipefail
          az containerapp update \
            --name "${{ secrets.CONTAINER_APP_NAME }}" \
            --resource-group "${{ secrets.RESOURCE_GROUP }}" \
            --image "$IMAGE" \
            --set-env-vars \
              database-url="$DATABASE_URL" \
              database-username="$DATABASE_USERNAME" \
              database-password="$DATABASE_PASSWORD" \
              jwt-secret="$JWT_SECRET" \
              SPRING_PROFILES_ACTIVE="$DEPLOY_ENV" \
              MAIL_HOST="$MAIL_HOST" \
              MAIL_PORT="$MAIL_PORT" \
              MAIL_USERNAME="$MAIL_USERNAME" \
              MAIL_PASSWORD="$MAIL_PASSWORD" \
              MAIL_FROM="$MAIL_FROM" \
              FRONTEND_BASE_URL="$FRONTEND_BASE_URL" \
            --min-replicas 0 \
            --max-replicas 2 \
            --scale-rule-name http-scale \
            --scale-rule-type http \
            --scale-rule-http-concurrency 50
          az containerapp ingress update \
            --name "${{ secrets.CONTAINER_APP_NAME }}" \
            --resource-group "${{ secrets.RESOURCE_GROUP }}" \
            --target-port 8080
          # The app pulls from GHCR anonymously. Drop any Azure Container
          # Registry entry so the app config carries no stale credentials.
          # This runs after the image update, so the live revision never
          # loses access to the image it is running.
          for server in $(az containerapp registry list \
              --name "${{ secrets.CONTAINER_APP_NAME }}" \
              --resource-group "${{ secrets.RESOURCE_GROUP }}" \
              --query "[?ends_with(server, '.azurecr.io')].server" -o tsv); do
            az containerapp registry remove \
              --name "${{ secrets.CONTAINER_APP_NAME }}" \
              --resource-group "${{ secrets.RESOURCE_GROUP }}" \
              --server "$server"
          done
