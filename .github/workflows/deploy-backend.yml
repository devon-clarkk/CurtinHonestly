name: Deploy Backend

on:
  push:
    branches:
      - dev
      - development
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
    steps:
      - id: pick
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "environment=prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=dev" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: resolve-environment
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-environment.outputs.environment }}
    env:
      DEPLOY_ENV: ${{ needs.resolve-environment.outputs.environment }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image to ACR
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name "${{ secrets.ACR_NAME }}"
          IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/curtinhonestly-backend:${IMAGE_TAG}"
          docker build -t "$IMAGE" ./backend
          docker push "$IMAGE"

      - name: Deploy to Container App
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          # Fallback keeps the port a valid integer even if the secret is unset,
          # so the app boots (email just stays in log-only mode) instead of failing to parse.
          MAIL_PORT: ${{ secrets.MAIL_PORT || '587' }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          FRONTEND_BASE_URL: ${{ secrets.FRONTEND_BASE_URL }}
        run: |
          set -euo pipefail
          IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/curtinhonestly-backend:${IMAGE_TAG}"
          az containerapp registry set \
            --name "${{ secrets.CONTAINER_APP_NAME }}" \
            --resource-group "${{ secrets.RESOURCE_GROUP }}" \
            --server "${{ secrets.ACR_LOGIN_SERVER }}" \
            --identity system
          az containerapp update \
            --name "${{ secrets.CONTAINER_APP_NAME }}" \
            --resource-group "${{ secrets.RESOURCE_GROUP }}" \
            --image "$IMAGE" \
            --set-env-vars \
              database-url="$DATABASE_URL" \
              database-username="$DATABASE_USERNAME" \
              database-password="$DATABASE_PASSWORD" \
              jwt-secret="$JWT_SECRET" \
              SPRING_PROFILES_ACTIVE="$DEPLOY_ENV" \
              MAIL_HOST="$MAIL_HOST" \
              MAIL_PORT="$MAIL_PORT" \
              MAIL_USERNAME="$MAIL_USERNAME" \
              MAIL_PASSWORD="$MAIL_PASSWORD" \
              MAIL_FROM="$MAIL_FROM" \
              FRONTEND_BASE_URL="$FRONTEND_BASE_URL"
          az containerapp ingress update \
            --name "${{ secrets.CONTAINER_APP_NAME }}" \
            --resource-group "${{ secrets.RESOURCE_GROUP }}" \
            --target-port 8080
