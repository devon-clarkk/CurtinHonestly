name: Azure Static Web Apps CI/CD (Admin Prod)

# Pull requests get a build check only. Deploying a preview environment per PR
# hit the Free tier's cap of three, because a PR merged within a minute of
# opening let the close job run before the build had uploaded, leaving an
# orphan that nothing ever deleted. Previews are not used here, so the Azure
# action now runs only on push and dispatch, as the frontend prod workflow
# already did.
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

jobs:
  build_check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Build Check
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-frontend/package-lock.json
      - name: Install
        working-directory: admin-frontend
        run: npm ci
      - name: Build
        working-directory: admin-frontend
        # The API URL is only baked into environment.ts, so the default is fine
        # for a compile check.
        run: npm run build

  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
          script: |
            const coredemo = require('@actions/core')
            return await coredemo.getIDToken()
          result-encoding: string
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          API_URL: ${{ secrets.API_URL }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_MUD_057F08200 }}
          action: upload
          app_location: admin-frontend
          api_location: ''
          output_location: dist/admin-frontend/browser
          app_build_command: npm run build
          github_id_token: ${{ steps.idtoken.outputs.result }}
