trigger: none
pr: none

name: backend_$(Date:yyyyMMdd)$(Rev:.r)

parameters:
  - name: environment
    displayName: Environment
    type: string
    default: dev
    values:
      - dev
      - prod

variables:
  # Required variables to set in ADO pipeline/UI:
  # - AZURE_SERVICE_CONNECTION (service connection name)
  # - CONTAINERAPPS_ENVIRONMENT (Azure Container Apps environment name)
  # - CONTAINERAPP_NAME_DEV
  # - CONTAINERAPP_NAME_PROD
  # - RESOURCE_GROUP
  # - REGISTRY_LOGIN_SERVER (e.g. myregistry.azurecr.io OR ghcr.io)
  # - REGISTRY_USERNAME (if not using managed identity)
  # - REGISTRY_PASSWORD (if not using managed identity)
  # - IMAGE_REPOSITORY (e.g. curtinhonestly-backend)
  #
  # Backend runtime config (per env):
  # - DATABASE_URL_DEV / DATABASE_URL_PROD
  # - DATABASE_USERNAME_DEV / DATABASE_USERNAME_PROD
  # - DATABASE_PASSWORD_DEV / DATABASE_PASSWORD_PROD
  # - JWT_SECRET_DEV / JWT_SECRET_PROD
  dockerImageTag: $(Build.SourceVersion)

pool:
  vmImage: ubuntu-latest

stages:
  - stage: BuildAndPush
    displayName: Build + push container image
    jobs:
      - job: build
        displayName: Docker build/push
        steps:
          - checkout: self
            fetchDepth: 1

          - task: Docker@2
            displayName: Login to container registry
            inputs:
              command: login
              containerRegistry: $(DOCKER_REGISTRY_SERVICE_CONNECTION)

          - task: Docker@2
            displayName: Build and push backend image
            inputs:
              command: buildAndPush
              repository: $(IMAGE_REPOSITORY)
              dockerfile: backend/Dockerfile
              buildContext: backend
              tags: |
                $(dockerImageTag)

  - stage: Deploy
    displayName: Deploy to Azure Container Apps
    dependsOn: BuildAndPush
    jobs:
      - deployment: deploy_backend
        displayName: Deploy backend (${{ parameters.environment }})
        environment: curtinhonestly-backend-${{ parameters.environment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: Deploy container app revision
                  inputs:
                    azureSubscription: $(AZURE_SERVICE_CONNECTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      if [ '${{ parameters.environment }}' = 'prod' ]; then
                        APP_NAME="$(CONTAINERAPP_NAME_PROD)"
                        DATABASE_URL="$(DATABASE_URL_PROD)"
                        DATABASE_USERNAME="$(DATABASE_USERNAME_PROD)"
                        DATABASE_PASSWORD="$(DATABASE_PASSWORD_PROD)"
                        JWT_SECRET="$(JWT_SECRET_PROD)"
                      else
                        APP_NAME="$(CONTAINERAPP_NAME_DEV)"
                        DATABASE_URL="$(DATABASE_URL_DEV)"
                        DATABASE_USERNAME="$(DATABASE_USERNAME_DEV)"
                        DATABASE_PASSWORD="$(DATABASE_PASSWORD_DEV)"
                        JWT_SECRET="$(JWT_SECRET_DEV)"
                      fi

                      IMAGE="$(REGISTRY_LOGIN_SERVER)/$(IMAGE_REPOSITORY):$(dockerImageTag)"

                      # Update image + env vars
                      az containerapp update \
                        --name "$APP_NAME" \
                        --resource-group "$(RESOURCE_GROUP)" \
                        --image "$IMAGE" \
                        --set-env-vars \
                          DATABASE_URL="$DATABASE_URL" \
                          DATABASE_USERNAME="$DATABASE_USERNAME" \
                          DATABASE_PASSWORD="$DATABASE_PASSWORD" \
                          JWT_SECRET="$JWT_SECRET" \
                          SPRING_PROFILES_ACTIVE="${{ parameters.environment }}"

