trigger: none
pr: none

name: frontend_$(Date:yyyyMMdd)$(Rev:.r)

parameters:
  - name: environment
    displayName: Environment
    type: string
    default: dev
    values:
      - dev
      - prod

variables:
  # Set these in the pipeline UI (Library/Variables) or at queue-time.
  # - SWA_DEPLOYMENT_TOKEN_DEV
  # - SWA_DEPLOYMENT_TOKEN_PROD
  # - API_URL_DEV
  # - API_URL_PROD
  nodeVersion: '22.x'

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    fetchDepth: 1

  - task: NodeTool@0
    displayName: Use Node $(nodeVersion)
    inputs:
      versionSpec: $(nodeVersion)

  - script: |
      cd frontend
      npm ci
    displayName: Install frontend deps

  - script: |
      cd frontend
      if [ '${{ parameters.environment }}' = 'prod' ]; then
        export API_URL="$(API_URL_PROD)"
      else
        export API_URL="$(API_URL_DEV)"
      fi
      npm run build
    displayName: Build frontend (sets API_URL)

  # Deploy to Azure Static Web Apps.
  # Requires installing the Azure Static Web Apps task in Azure DevOps:
  # https://learn.microsoft.com/en-us/azure/static-web-apps/
  - task: AzureStaticWebApp@0
    displayName: Deploy to Azure Static Web Apps
    inputs:
      # Use the SWA "Deployment token" from the Azure portal
      azure_static_web_apps_api_token: ${{ if eq(parameters.environment, 'prod') }}:
        $(SWA_DEPLOYMENT_TOKEN_PROD)
        ${{ else }}:
        $(SWA_DEPLOYMENT_TOKEN_DEV)
      app_location: frontend
      api_location: ""
      output_location: dist/frontend/browser

