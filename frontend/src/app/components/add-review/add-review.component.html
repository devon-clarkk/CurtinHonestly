<div class="review-form-container">
  <h3>{{ isEditing ? 'Edit Your Review for ' : 'Add a Review for ' }}{{ unitCode() }}</h3>
  <form (ngSubmit)="onSubmit()" #reviewForm="ngForm">
    
    <div class="form-grid">
      <!-- Rating Section -->
      <div class="form-group">
        <label for="rating">Rating (1-5 stars)</label>
        <div class="rating-input">
          <input type="range" id="rating" min="1" max="5" step="1" [ngModel]="rating()" (ngModelChange)="rating.set($event)" name="rating">
          <span class="rating-value">{{ rating() }} / 5</span>
        </div>
      </div>

      <div class="form-group">
        <label for="workload">Workload (1-10)</label>
        <div class="rating-input">
          <input type="range" id="workload" min="1" max="10" step="1" [ngModel]="workload()" (ngModelChange)="workload.set($event)" name="workload">
          <span class="rating-value">{{ workload() }} / 10</span>
        </div>
      </div>
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label for="semester">Semester Taken</label>
        <!-- ngValue, not value: the option carries a structured (termType, termYear)
             pair, and [value] would stringify it to "[object Object]". -->
        <select id="semester" [ngModel]="selectedSemester()" (ngModelChange)="selectedSemester.set($event)" name="semesterTaken" class="form-control">
          <option *ngFor="let option of semesterOptions()" [ngValue]="option">{{ option.label }}</option>
        </select>
      </div>

      <div class="form-group">
        <label for="professor">Professor (Optional)</label>
        <input type="text" id="professor" [ngModel]="professor()" (ngModelChange)="professor.set($event)" name="professor" class="form-control" placeholder="Who taught this unit?">
      </div>
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label for="finalGrade">Final Grade (%) (Optional)</label>
        <input type="number" id="finalGrade" min="0" max="100" [ngModel]="finalGrade()" (ngModelChange)="finalGrade.set($event)" name="finalGrade" class="form-control" placeholder="0-100">
      </div>

      <div class="form-checkboxes">
        <div class="checkbox-group">
          <input type="checkbox" id="hasExam" [ngModel]="hasExam()" (ngModelChange)="hasExam.set($event)" name="hasExam">
          <label for="hasExam">Had Exam?</label>
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="wouldTakeAgain" [ngModel]="wouldTakeAgain()" (ngModelChange)="wouldTakeAgain.set($event)" name="wouldTakeAgain">
          <label for="wouldTakeAgain">Would take again?</label>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label>What was it like? (Optional)</label>
      <div class="tag-chip-list">
        <button
          type="button"
          *ngFor="let tag of reviewTags"
          class="tag-chip"
          [class.selected]="isTagSelected(tag.value)"
          [attr.aria-pressed]="isTagSelected(tag.value)"
          (click)="toggleTag(tag.value)">
          {{ tag.label }}
        </button>
      </div>
    </div>

    <div class="form-group">
      <label for="reviewText">Your Review (min 10 characters)</label>
      <textarea id="reviewText" [ngModel]="reviewText()" (ngModelChange)="reviewText.set($event)" name="reviewText" rows="6" appAutoGrow class="form-control review-textarea" placeholder="What did you think of this unit? Was it hard? Interesting?"></textarea>
    </div>

    <div *ngIf="errorMessage()" class="error-box">
      {{ errorMessage() }}
    </div>

    @if (successMessage()) {
      <div class="success-box">{{ successMessage() }}</div>
    }

    <div class="form-actions">
      <button type="button" (click)="onCancel()" class="btn btn-secondary" [disabled]="isLoading()">Cancel</button>
      <button type="submit" class="btn btn-primary" [disabled]="isLoading() || !reviewText() || reviewText().length < 10">
        {{ isLoading() ? (isEditing ? 'Saving...' : 'Submitting...') : (isEditing ? 'Save Changes' : 'Post Review') }}
      </button>
    </div>
  </form>
</div>
