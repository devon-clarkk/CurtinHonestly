<div class="auth-container">
  <div class="auth-card">
    <h2>Join Curtin Honestly</h2>
    <p class="subtitle">Create an account to help others with your unit experiences.</p>

    <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
      <div class="form-group">
        <label for="email">Curtin Student Email</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="email" 
          required 
          placeholder="your.name@student.curtin.edu.au"
          #emailInput="ngModel"
        >
        <div class="hint">Must end with &#64;student.curtin.edu.au</div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="password" 
          required
        >
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input 
          type="password" 
          id="confirmPassword" 
          name="confirmPassword" 
          [(ngModel)]="confirmPassword" 
          required
        >
      </div>

      <div *ngIf="errorMessage()" class="error-box">
        {{ errorMessage() }}
      </div>

      <div *ngIf="successMessage()" class="success-box">
        {{ successMessage() }}
      </div>

      <button type="submit" [disabled]="!registerForm.valid || isLoading()" class="btn btn-primary">
        {{ isLoading() ? 'Creating account...' : 'Register' }}
      </button>

      <div class="auth-footer">
        Already have an account? <a routerLink="/login">Login here</a>
      </div>
    </form>
  </div>
</div>
