<!-- Main layout for the entire website -->
<header class="main-header">
  <div class="header-container">
    <div class="logo">
      <div class="logo-group">
        <a routerLink="/">
          <img src="/assets/images/logo.png" alt="Curtin Honestly Logo" class="header-logo">
        </a>
        <span class="disclaimer">Independent student platform. Not affiliated with Curtin University.</span>
      </div>
    </div>
    <nav>
      <a routerLink="/">Home</a>
      <ng-container *ngIf="!authService.currentUser()">
        <a routerLink="/login">Login</a>
        <a routerLink="/register" class="register-link">Register</a>
      </ng-container>
      <ng-container *ngIf="authService.currentUser()">
        <span class="user-email">{{ authService.currentUser() }}</span>
        <a href="javascript:void(0)" (click)="logout()">Logout</a>
      </ng-container>
    </nav>
  </div>
</header>

<main class="content-body">
  <!-- This is where all your different pages (components) will appear! -->
  <router-outlet></router-outlet>
</main>

<footer class="main-footer">
  <div class="footer-container">
    <p>We created Curtin Honestly to give students a space for real feedback so you can make better choices about your studies.</p>
    <p class="copyright">&copy; 2026 Curtin Honestly</p>
  </div>
</footer>

<style>
/* Header — handbook-style: white bar, black type, gold accent */
.main-header {
  background-color: var(--header-background);
  color: var(--header-text);
  padding: 12px 0;
  border-bottom: 1px solid var(--border-color);
  box-shadow: none;
  position: sticky;
  top: 0;
  z-index: 1000;
}

.header-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.disclaimer {
  font-size: 0.65rem;
  color: var(--text-secondary);
  font-style: italic;
  max-width: 220px;
  line-height: 1.2;
}

.logo {
  display: flex;
  align-items: center;
}

nav {
  display: flex;
  gap: 30px;
}

.header-logo {
  height: 40px; /* reduced logo height */
  width: auto;
  display: block;
}

nav a {
  color: var(--header-text);
  text-decoration: none;
  font-weight: 700;
  font-family: var(--header-font);
  font-size: 1rem;
  padding-bottom: 4px;
  border-bottom: 3px solid transparent;
  transition: border-color 0.2s;
}

nav a:hover,
nav a.router-link-active {
  border-bottom-color: var(--primary-color);
}

nav a.register-link {
  background-color: var(--primary-color);
  color: var(--secondary-color);
  padding: 8px 16px;
  border-radius: var(--radius-none);
  border-bottom: none;
  margin-top: -4px;
  transition: background-color 0.2s;
}

nav a.register-link:hover {
  background-color: #a8840f;
  border-bottom: none;
}

.user-email {
  color: var(--text-secondary);
  font-size: 0.9rem;
  font-weight: 500;
  display: flex;
  align-items: center;
}

/* Body and Footer Styling */
.content-body {
  min-height: calc(100vh - 140px); /* Adjust based on header/footer height */
  padding: 10px 20px 20px 20px; /* Reduced top padding */
}

.main-footer {
  background-color: var(--secondary-color);
  color: #f0f0f0;
  padding: 40px 20px;
  text-align: center;
  border-top: 4px solid var(--primary-color);
}

.footer-container {
  max-width: 800px;
  margin: 0 auto;
}

.main-footer p {
  font-size: 1.1rem;
  line-height: 1.6;
  margin-bottom: 15px;
}

.main-footer .copyright {
  font-size: 0.85rem;
  color: #b3b3b3;
  margin-top: 20px;
  margin-bottom: 0;
}
</style>
